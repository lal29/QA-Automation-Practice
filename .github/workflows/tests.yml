name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: chromium
          - browser: firefox
            label: firefox
          - browser: webkit
            label: webkit
          - browser: webkit
            label: mobile-iphone13
            device: "iPhone 13"
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup project"
        uses: ./.github/actions/setup-project/

      - name: "Run tests"
        run: pytest tests/ --browser ${{ matrix.browser }} --junitxml=reportJUNIT.xml --html=reportHTML.html --self-contained-html
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          DEVICE: ${{ matrix.device }}

      - name: "Publish test report using dorny"
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: "Pytest Results (${{ matrix.label }})"
          path: reportJUNIT.xml
          reporter: java-junit

      - name: "Upload junit test report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ matrix.label }}
          path: reportJUNIT.xml

      - name: "Upload HTML report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.label }}
          path: reportHTML.html

      - name: "Upload failure artifacts"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.label }}
          path: test-results/
  update-visual-snapshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - name: "Setup project"
        uses: ./.github/actions/setup-project/

      - name: "Update visual snapshots"
        run: pytest tests/test_visual.py --update-snapshots || true
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: "Commit updated snapshots"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual_snapshots/
          git diff --staged --quiet || git commit -m "Update visual regression baselines"
          git push
