name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Setup python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Install dependencies"
        run: pip install -r requirements.txt

      - name: "Install Playwright browsers"
        run: playwright install --with-deps

      - name: "Run tests"
        run: pytest tests/
